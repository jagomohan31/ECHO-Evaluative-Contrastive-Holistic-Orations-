[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlens"
version = "0.1.0"
description = "Contrastive speech analytics with temporal flaw grounding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "librosa>=0.10",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.3",
    "torch>=2.2",
    "transformers>=4.39",
    "num2words>=0.5.13",
    "cmudict>=1.0.13",
    "Unidecode>=1.3",
    "imageio-ffmpeg>=0.4.9",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "pypdf>=4.0",
    "jiwer>=3.0",
    "krippendorff>=0.6",
]
asr = [
    "faster-whisper>=1.0",
]

[project.scripts]
speechlens = "speechlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (model download, long audio)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"